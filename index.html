<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📡</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>">

  <!-- ?v= : cache-busting (le serveur http.server n'envoie pas de Cache-Control) -->
  <link rel="stylesheet" href="style.css?v=2">

  <!-- New modular app -->
  <script type="module" src="app.js?v=2"></script>
</head>

<body>
  
  <!-- Brightness Control (Dark Overlay) -->
  <div id="dark"></div>
  
  <!-- Click Zone -->
  <div id="click-catcher"></div>

  <!-- Channels Selector UI -->
  <div id="channels">
    <div class="channel">
      <img src="logos/BTV.png" draggable="false" />
    </div>
  </div>

  <!-- Vidéo d'intro locale, jouée en boucle au démarrage (aucune UI YouTube). -->
  <video id="intro-player" loop playsinline autoplay muted>
    <source src="videos/intro.webm" type="video/webm" />
  </video>

  <!-- YouTube Player Container -->
  <div id="player"></div>

  <!-- HTML5 Movie Player -->
  <!-- crossorigin: requis pour charger les pistes <track> servies par l'API (autre origine) -->
  <div id="movie-container">
    <video id="movie-player" crossorigin="anonymous"></video>
    <!-- Calque transparent AU-DESSUS de la vidéo : un <video> est un élément
         « remplacé » dont les événements souris sont capricieux sur l'appareil
         (mouseout relatedTarget null, mousemove perdus au survol des bandes
         letterbox en 16:9) → le curseur ET le HUD de sous-titres s'effaçaient
         hors de l'image. Un simple <div> normalise la capture des mouvements. -->
    <div id="movie-mouse-catch"></div>
  </div>

</body>

</html>
